name: Deploy Backend
# Deploys backend, frontend, and nginx configuration

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # --- Deploy Backend ---
            cd /opt/chinesemath-backend
            git fetch origin main
            git reset --hard origin/main
            echo DATABASE_URL="${{ secrets.DATABASE_URL }}" > .env
            echo JWT_SECRET="${{ secrets.JWT_SECRET }}" >> .env
            echo EMAIL_HOST="${{ secrets.EMAIL_HOST }}" >> .env
            echo EMAIL_PORT="${{ secrets.EMAIL_PORT }}" >> .env
            echo EMAIL_SECURE="${{ secrets.EMAIL_SECURE }}" >> .env
            echo EMAIL_USER="${{ secrets.EMAIL_USER }}" >> .env
            echo EMAIL_PASSWORD="${{ secrets.EMAIL_PASSWORD }}" >> .env
            docker compose down --remove-orphans -v --timeout 30 || true
            docker system prune -f
            sleep 3
            docker compose up -d --build
            sleep 30
            docker logs chinesemath-backend-backend-1
            curl -sf http://localhost:4000/api/health || exit 1
            
            # --- Rebuild Frontend (backend deploy may have stopped it) ---
            cd /opt/chinesemath-frontend
            git fetch origin main
            git reset --hard origin/main
            docker compose build --no-cache
            docker compose up -d
            sleep 5
            curl -sf http://localhost:3000/ || echo "WARNING: Frontend not responding"
            
            # --- Update Nginx Config (preserving other sites) ---
            echo "=== Updating examroomedu nginx config ==="
            
            # Remove only examroomedu configs (not other sites!)
            sudo rm -f /etc/nginx/sites-enabled/examroomedu
            sudo rm -f /etc/nginx/sites-available/examroomedu
            sudo rm -f /etc/nginx/sites-available/examroomedu.com*
            
            # Deploy fresh config
            sudo cp nginx.conf /etc/nginx/sites-available/examroomedu
            sudo ln -sf /etc/nginx/sites-available/examroomedu /etc/nginx/sites-enabled/examroomedu
            
            # Test and restart
            sudo nginx -t
            sudo systemctl restart nginx
            
            # Verify
            echo "=== Nginx status ==="
            sudo systemctl status nginx --no-pager
            echo "=== Nginx error log ==="
            sudo tail -20 /var/log/nginx/error.log
            echo "=== Docker containers ==="
            docker ps
            echo "=== Curl tests ==="
            curl -sf http://localhost:4000/api/health && echo "Backend OK" || echo "Backend FAIL"
            curl -sf http://localhost:3000/ > /dev/null && echo "Frontend OK" || echo "Frontend FAIL"
